name: Supabase Keepalive

on:
  schedule:
    # Run every 4 hours to keep the project active
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API directly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret."
            exit 1
          fi

          # Hit the public REST API with the anon key. This is exactly the
          # public API Gateway traffic Supabase's inactivity detector tracks,
          # so it keeps the project from being paused. No Vercel deployment
          # is involved, which is what kept breaking before.
          base="${SUPABASE_URL%/}"

          # Tables to probe, in priority order. Success on any one is enough.
          tables="devices cameras keepalive_pings"

          echo "[$TIMESTAMP] Pinging Supabase REST API..."
          echo "   Project: $base"

          ok=0
          for table in $tables; do
            url="${base}/rest/v1/${table}?select=id&limit=1"
            status="$(curl --show-error --silent -o /dev/null -w "%{http_code}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              "$url" || echo "000")"

            echo "   ${table}: HTTP ${status}"

            # 2xx = read succeeded. 401/403/404 still reached the API Gateway
            # (which is all the inactivity detector needs) but indicate the
            # table/RLS changed, so we only count 2xx as a clean success.
            case "$status" in
              2*)
                ok=1
                ;;
            esac
          done

          if [ "$ok" = "1" ]; then
            echo "Keepalive request succeeded — Supabase project is active."
            exit 0
          fi

          echo ""
          echo "Keepalive failed: no table returned a 2xx response."
          echo "   The API Gateway was likely still reached (which keeps the"
          echo "   project alive), but verify the anon key and table names."
          exit 1
